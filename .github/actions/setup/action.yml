name: Setup

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v6
      with:
        node-version: 22.x
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --prefer-offline --network-concurrency 1
      shell: bash
